<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dam Break Inundation Modeling using HydroDynamic Modelling</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header>

        <h1>Dam Break Inundation Modeling using HydroDynamic Modelling</h1>

        <p>
            Inundation Modelling & Decision Support System
        </p>

    </header>


    <main class="home-container">

        <div class="welcome-card">

            <h2>Select Hazard Scenario</h2>

            <p class="description">
                Select the type of flood scenario you want to simulate.
            </p>


            <label for="scenario">
                Scenario Type
            </label>


            <select id="scenario">

                <option value="">
                    -- Select Scenario --
                </option>

                <!-- Display name: Dam Break -->
                <!-- Keep value="dam_breach" for backend compatibility -->
                <option value="dam_breach">
                    Dam Break
                </option>

                <option value="natural_outbreak">
                    Natural Outbreak / Lake Outburst
                </option>

            </select>


            <button onclick="continueScenario()">
                Continue
            </button>

        </div>

    </main>


    <script>

        function continueScenario() {

            const scenario =
                document.getElementById("scenario").value;


            if (scenario === "") {

                alert("Please select a scenario.");

                return;
            }


            if (scenario === "dam_breach") {

                window.location.href = "/dam-breach";

            }


            else if (scenario === "natural_outbreak") {

                window.location.href = "/natural-outbreak";

            }

        }

    </script>

</body>

</html>
