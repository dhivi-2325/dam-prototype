<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Dam Break Decision Support System
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for(
            'static',
            filename='css/style.css'
        ) }}"
    >

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

</head>


<body>


<header>

    <h1>
        AI-Enabled Dam Break
    </h1>

    <p>
        Inundation Modelling &
        Decision Support System
    </p>

</header>


<div class="container">


    <!-- INPUT SECTION -->

    <section class="input-card">

        <h2>
            Dam & Breach Parameters
        </h2>


        <label>
            Dam Height (m)
        </label>

        <input
            type="number"
            id="dam_height"
            value="30"
        >


        <label>
            Water Level (m)
        </label>

        <input
            type="number"
            id="water_level"
            value="25"
        >


        <label>
            Breach Width (m)
        </label>

        <input
            type="number"
            id="breach_width"
            value="15"
        >


        <label>
            Breach Formation Time (minutes)
        </label>

        <input
            type="number"
            id="breach_time"
            value="30"
        >


        <button
            onclick="runSimulation()"
        >

            Run Flood Simulation

        </button>

    </section>



    <!-- RESULTS -->

    <section class="results">

        <h2>
            Simulation Results
        </h2>


        <div class="cards">


            <div class="card">

                <h3>
                    Maximum Depth
                </h3>

                <p id="max_depth">
                    --
                </p>

                <span>
                    meters
                </span>

            </div>


            <div class="card">

                <h3>
                    Inundated Area
                </h3>

                <p id="area">
                    --
                </p>

                <span>
                    m²
                </span>

            </div>


            <div class="card">

                <h3>
                    Risk Status
                </h3>

                <p id="risk">
                    --
                </p>

            </div>


        </div>

    </section>



    <!-- MAP -->

    <section class="map-section">

        <h2>
            Flood Inundation Map
        </h2>

        <div id="map"></div>

    </section>


</div>



<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
>
</script>


<script
    src="{{ url_for(
        'static',
        filename='js/script.js'
    ) }}"
>
</script>


</body>

</html>
